name: Build and test ChanFlow

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test
      - name: Test and lint Android
        run: chmod +x gradlew && ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Restore permanent release key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.CHANFLOW_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE" || { echo '::error::Release signing key is missing'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/chanflow.p12"
          chmod 600 "$RUNNER_TEMP/chanflow.p12"
      - name: Build signed release
        if: github.event_name != 'pull_request'
        env:
          CHANFLOW_KEYSTORE_PATH: ${{ runner.temp }}/chanflow.p12
          CHANFLOW_KEYSTORE_PASSWORD: ${{ secrets.CHANFLOW_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
      - name: Upload APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: chanflow-build
          path: |
            app/build/outputs/apk/
            app/build/reports/
          retention-days: 14
      - name: Publish versioned APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test "$TAG" = "v$VERSION" || { echo '::error::Tag does not match app version'; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk chanflow.apk
          gh release create "$TAG" chanflow.apk --title "ChanFlow $TAG" --generate-notes

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test private vault on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest && adb shell run-as dev.chanflow.app.preview cat cache/qa-offline.png > app/build/qa-offline.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chanflow-device-tests
          path: |
            app/build/reports/androidTests/
            app/build/qa-offline.png
